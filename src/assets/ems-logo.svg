<svg width="220" height="60" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <rect x="2" y="2" width="56" height="56" rx="14" fill="url(#badgeGrad)"/>

  <!-- People icon (two overlapping figures representing "employees") -->
  <g fill="#FFFFFF">
    <!-- back figure -->
    <circle cx="22" cy="22" r="6.5" opacity="0.85"/>
    <path d="M11 42c0-7.2 5.9-11 11-11s11 3.8 11 11v3H11v-3z" opacity="0.85"/>
    <!-- front figure -->
    <circle cx="37" cy="24" r="7.5"/>
    <path d="M23 45c0-8 6.7-12.5 14-12.5S51 37 51 45v3H23v-3z"/>
  </g>

  <!-- Wordmark -->
  <text x="72" y="28" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E293B">EMS</text>
  <text x="72" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748B" letter-spacing="0.5">Employee Management</text>
</svg>
